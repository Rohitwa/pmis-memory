# Static site: Store Monitoring pricing (separate app/domain from the report site)
app = "store-monitoring-pricing"
primary_region = "sin"

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
