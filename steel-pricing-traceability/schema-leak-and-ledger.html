<title>The Leak and the Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
  :root {
    --ink: #1B222B;
    --body-c: #2A333D;
    --muted: #5C6B7A;
    --ground: #F6F8F9;
    --surface: #FFFFFF;
    --line: #D8DEE4;
    --accent: #2E5A80;
    --accent-soft: #E3ECF4;
    --amber: #B26A12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #E8EDF2; --body-c: #C6CFD8; --muted: #8B99A7;
      --ground: #14181D; --surface: #1C2229; --line: #323C47;
      --accent: #7FABD1; --accent-soft: #24313E; --amber: #D99A45;
    }
  }
  :root[data-theme="dark"] {
    --ink: #E8EDF2; --body-c: #C6CFD8; --muted: #8B99A7;
    --ground: #14181D; --surface: #1C2229; --line: #323C47;
    --accent: #7FABD1; --accent-soft: #24313E; --amber: #D99A45;
  }
  body {
    background: var(--ground); color: var(--body-c);
    font-family: "Source Serif 4", Georgia, serif;
    margin: 0; padding: 3rem 1.25rem 4.5rem; line-height: 1.6;
  }
  .page { max-width: 780px; margin: 0 auto; }
  .eyebrow {
    font-family: Archivo, Arial, sans-serif; font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 0.6rem;
  }
  h1 {
    font-family: Archivo, Arial, sans-serif; font-size: clamp(1.7rem, 4vw, 2.2rem);
    font-weight: 700; color: var(--ink); margin: 0 0 2.2rem; text-wrap: balance;
  }
  figure {
    margin: 0 0 2.6rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 1.4rem 1.25rem 1rem;
  }
  figure svg { display: block; max-width: 100%; height: auto; margin: 0 auto; color: var(--body-c); }
  figcaption {
    font-size: 0.93rem; color: var(--muted);
    border-top: 1px solid var(--line); margin-top: 1rem; padding-top: 0.75rem;
  }
  figcaption b { color: var(--ink); font-weight: 600; }
  .fig-num {
    font-family: Archivo, Arial, sans-serif; font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
    display: block; margin-bottom: 0.15rem;
  }
  .box { fill: var(--surface); stroke: currentColor; stroke-width: 1.2; }
  .box-hero { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
  .flow { stroke: currentColor; stroke-width: 1.4; fill: none; }
  .thread { stroke: var(--accent); stroke-width: 2; fill: none; }
  .leak { stroke: var(--amber); stroke-width: 2; fill: none; }
  .ttl { font-family: Archivo, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: var(--ink); }
  .ttl-a { font-family: Archivo, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: var(--accent); letter-spacing: 0.06em; }
  .lbl { font-family: Archivo, Arial, sans-serif; font-size: 11px; fill: var(--muted); }
  .lbl-am { font-family: Archivo, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: var(--amber); }
  .lbl-ac { font-family: Archivo, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: var(--accent); }
  .half { font-family: Archivo, Arial, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; fill: var(--muted); }
</style>

<div class="page">
  <p class="eyebrow">Steel pricing traceability · schema</p>
  <h1>The Leak and the Ledger</h1>

  <!-- FIG 1 · THE LEAK -->
  <figure>
    <svg viewBox="0 0 720 250" role="img" aria-label="A maker buys steel at live prices paid now, is paid for parts at old index prices months later, and finances the gap.">
      <defs>
        <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
        </marker>
        <marker id="ar-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
        </marker>
        <marker id="ar-m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--amber)"/>
        </marker>
      </defs>

      <rect class="box" x="48" y="48" width="128" height="56" rx="4"/>
      <text class="ttl" x="112" y="81" text-anchor="middle">MILL</text>
      <rect class="box-hero" x="296" y="48" width="128" height="56" rx="4"/>
      <text class="ttl" x="360" y="81" text-anchor="middle">MAKER</text>
      <rect class="box" x="544" y="48" width="128" height="56" rx="4"/>
      <text class="ttl" x="608" y="81" text-anchor="middle">OEM</text>

      <line class="flow" x1="180" y1="64" x2="288" y2="64" marker-end="url(#ar)"/>
      <text class="lbl" x="234" y="54" text-anchor="middle">steel · live price</text>
      <line class="flow" x1="288" y1="92" x2="184" y2="92" marker-end="url(#ar)"/>
      <text class="lbl" x="234" y="112" text-anchor="middle">cash · now</text>
      <line class="flow" x1="428" y1="64" x2="536" y2="64" marker-end="url(#ar)"/>
      <text class="lbl" x="482" y="54" text-anchor="middle">parts</text>
      <line class="flow" x1="536" y1="92" x2="432" y2="92" marker-end="url(#ar)"/>
      <text class="lbl" x="482" y="112" text-anchor="middle">cash · late · old index</text>

      <line class="leak" x1="340" y1="108" x2="334" y2="134"/>
      <line class="leak" x1="360" y1="108" x2="358" y2="138"/>
      <line class="leak" x1="380" y1="108" x2="384" y2="134"/>
      <text class="lbl-am" x="360" y="156" text-anchor="middle">the leak</text>

      <line class="flow" x1="80" y1="205" x2="640" y2="205"/>
      <line class="flow" x1="120" y1="198" x2="120" y2="212"/>
      <line class="flow" x1="560" y1="198" x2="560" y2="212"/>
      <line class="leak" x1="120" y1="205" x2="560" y2="205"/>
      <text class="lbl" x="120" y="230" text-anchor="middle">day 0 · pays mill</text>
      <text class="lbl" x="560" y="230" text-anchor="middle">day 90–180 · gets paid</text>
      <text class="lbl-am" x="340" y="191" text-anchor="middle">maker finances this gap</text>
    </svg>
    <figcaption><span class="fig-num">1 · The leak</span>Buys at <b>live prices, cash now</b>; paid at <b>old index prices, months later</b>. Two problems hide inside: nobody can trace the metal, and somebody must carry the wait.</figcaption>
  </figure>

  <!-- FIG 2 · PART TRACKING: WHY → FIX -->
  <figure>
    <svg viewBox="0 0 720 220" role="img" aria-label="Why part tracking fails: metal loses its identity inside the factory, so a part's true cost is unknown. The fix: agents join invoice, certificate and BOM so the thread from steel lot to part never breaks.">
      <text class="half" x="180" y="26" text-anchor="middle">WHY IT HAPPENS</text>
      <text class="half" x="550" y="26" text-anchor="middle">THE FIX</text>
      <line class="flow" x1="365" y1="40" x2="365" y2="195" stroke-dasharray="2 5" opacity="0.5"/>

      <!-- why: thread breaks -->
      <circle cx="75" cy="100" r="22" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="75" cy="100" r="10" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text class="lbl" x="75" y="150" text-anchor="middle">steel lot · ₹72/kg</text>

      <rect class="box" x="140" y="60" width="90" height="80" rx="4"/>
      <text class="lbl" x="185" y="78" text-anchor="middle">factory</text>
      <line class="thread" x1="97" y1="100" x2="156" y2="100"/>
      <circle cx="172" cy="96" r="1.8" fill="var(--accent)" opacity="0.55"/>
      <circle cx="185" cy="110" r="1.8" fill="var(--accent)" opacity="0.4"/>
      <circle cx="199" cy="94" r="1.8" fill="var(--accent)" opacity="0.3"/>
      <circle cx="211" cy="112" r="1.8" fill="var(--accent)" opacity="0.2"/>
      <text class="lbl" x="185" y="158" text-anchor="middle">identity melts · mixed lots</text>

      <line class="flow" x1="230" y1="100" x2="266" y2="100" marker-end="url(#ar)"/>
      <rect class="box" x="270" y="86" width="46" height="28" rx="4"/>
      <text class="lbl" x="293" y="132" text-anchor="middle">part</text>
      <text class="lbl-am" x="293" y="74" text-anchor="middle">cost = ?</text>

      <!-- fix: thread holds -->
      <circle cx="445" cy="100" r="22" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="445" cy="100" r="10" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text class="lbl" x="445" y="150" text-anchor="middle">steel lot · ₹72/kg</text>

      <rect class="box" x="510" y="60" width="90" height="80" rx="4"/>
      <text class="lbl" x="555" y="78" text-anchor="middle">factory</text>
      <line class="thread" x1="467" y1="100" x2="636" y2="100" marker-end="url(#ar-a)"/>
      <text class="lbl" x="555" y="158" text-anchor="middle">agents join invoice · certificate · BOM</text>

      <rect class="box" x="640" y="86" width="46" height="28" rx="4"/>
      <text class="lbl" x="663" y="132" text-anchor="middle">part</text>
      <text class="lbl-ac" x="663" y="74" text-anchor="middle">2.1 kg · ₹72 ✓</text>
    </svg>
    <figcaption><span class="fig-num">2 · Part tracking</span><b>Why:</b> metal loses its identity inside the factory — ERPs keep only averages, and the proof lies in papers nobody joins. <b>Fix:</b> agents join invoice, certificate and BOM, so the thread from lot to part never breaks.</figcaption>
  </figure>

  <!-- FIG 3 · WORKING CAPITAL: WHY → FIX -->
  <figure>
    <svg viewBox="0 0 720 235" role="img" aria-label="Why working capital drains: the money owed is real but undocumented, so the bank refuses and the maker carries the six-month wait. The fix: a proven claim is bankable, cash arrives in days, and the bank carries the wait.">
      <text class="half" x="180" y="26" text-anchor="middle">WHY IT HAPPENS</text>
      <text class="half" x="550" y="26" text-anchor="middle">THE FIX</text>
      <line class="flow" x1="365" y1="40" x2="365" y2="210" stroke-dasharray="2 5" opacity="0.5"/>

      <!-- why: claim invisible, maker carries -->
      <rect class="box" x="115" y="52" width="92" height="32" rx="4" stroke-dasharray="4 4"/>
      <text class="lbl" x="161" y="72" text-anchor="middle">claim ₹ · unproven</text>
      <rect class="box" x="255" y="48" width="58" height="40" rx="4"/>
      <text class="ttl" x="284" y="72" text-anchor="middle">BANK</text>
      <line class="flow" x1="211" y1="68" x2="249" y2="68" stroke-dasharray="4 4"/>
      <line class="flow" x1="224" y1="60" x2="238" y2="76" stroke-width="2"/>
      <line class="flow" x1="238" y1="60" x2="224" y2="76" stroke-width="2"/>
      <text class="lbl" x="230" y="46" text-anchor="middle">no loan</text>

      <line class="flow" x1="45" y1="165" x2="330" y2="165"/>
      <line class="flow" x1="65" y1="158" x2="65" y2="172"/>
      <line class="flow" x1="310" y1="158" x2="310" y2="172"/>
      <line class="leak" x1="65" y1="165" x2="310" y2="165"/>
      <line class="leak" x1="65" y1="130" x2="65" y2="160" marker-end="url(#ar-m)"/>
      <text class="lbl" x="65" y="120" text-anchor="middle">pays mill</text>
      <text class="lbl" x="65" y="188" text-anchor="middle">day 0</text>
      <text class="lbl" x="310" y="188" text-anchor="middle">day 180</text>
      <text class="lbl-am" x="188" y="210" text-anchor="middle">maker carries the wait</text>

      <!-- fix: claim proven, bank carries -->
      <rect class="box-hero" x="485" y="52" width="92" height="32" rx="4"/>
      <text class="lbl-ac" x="531" y="72" text-anchor="middle">claim ✓ proven</text>
      <rect class="box" x="625" y="48" width="58" height="40" rx="4"/>
      <text class="ttl" x="654" y="72" text-anchor="middle">BANK</text>
      <line class="thread" x1="581" y1="68" x2="619" y2="68" marker-end="url(#ar-a)"/>

      <line class="flow" x1="415" y1="165" x2="700" y2="165"/>
      <line class="flow" x1="435" y1="158" x2="435" y2="172"/>
      <line class="flow" x1="680" y1="158" x2="680" y2="172"/>
      <line class="leak" x1="435" y1="165" x2="465" y2="165"/>
      <line class="thread" x1="465" y1="165" x2="680" y2="165"/>
      <path class="thread" d="M 640 92 Q 560 120 470 158" fill="none" marker-end="url(#ar-a)"/>
      <text class="lbl-ac" x="530" y="118" text-anchor="middle">cash in days</text>
      <text class="lbl" x="435" y="188" text-anchor="middle">day 0</text>
      <text class="lbl" x="680" y="188" text-anchor="middle">day 180 · bank repaid</text>
      <text class="lbl-ac" x="565" y="210" text-anchor="middle">bank carries the wait</text>
    </svg>
    <figcaption><span class="fig-num">3 · Working capital</span><b>Why:</b> the money owed is real but has no document — banks fund only what's proven, so the weakest balance sheet carries the six-month wait. <b>Fix:</b> a proven claim is bankable; cash arrives in days and the bank carries the wait instead.</figcaption>
  </figure>

  <!-- FIG 4 · ONE LEDGER -->
  <figure>
    <svg viewBox="0 0 720 120" role="img" aria-label="One ledger of per-part truth powers both fixes: it keeps the thread for part tracking and creates the proof for working capital.">
      <rect class="box-hero" x="285" y="35" width="150" height="52" rx="5"/>
      <text class="ttl-a" x="360" y="57" text-anchor="middle">LEDGER</text>
      <text class="lbl" x="360" y="74" text-anchor="middle">per-part truth</text>
      <line class="thread" x1="281" y1="61" x2="185" y2="61" marker-end="url(#ar-a)"/>
      <line class="thread" x1="439" y1="61" x2="535" y2="61" marker-end="url(#ar-a)"/>
      <text class="lbl-ac" x="120" y="65" text-anchor="middle">keeps the thread</text>
      <text class="lbl-ac" x="602" y="65" text-anchor="middle">creates the proof</text>
    </svg>
    <figcaption><span class="fig-num">4 · One system</span>Both fixes are the same asset: a ledger of per-part truth — it <b>keeps the thread</b> (tracking) and <b>creates the proof</b> (cash).</figcaption>
  </figure>

  <p style="font-family: Archivo, Arial, sans-serif; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: center;">trace the metal → prove the money → move the money</p>
</div>
