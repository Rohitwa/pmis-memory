<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 210mm; height: 297mm;

  .logo { font-size: 28px; font-weight: 700; letter-spacing: 0.02em; color: #1B222B; }

  .rule { border: 0; border-top: 1.4px solid #1B222B; margin: 8px 0 0; }
  .sub { font-size: 11px; color: #5C6B7A; margin: 9px 0 0; text-align: center; }
  .fig { flex: 1; display: flex; align-items: center; justify-content: center; }
  svg { width: 172mm; height: auto; }
  .foot {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: #5C6B7A; text-align: center; border-top: 1px solid #D8DEE4; padding-top: 7px;
  }
  .foot b { color: #2E5A80; }
</style>
</head>
