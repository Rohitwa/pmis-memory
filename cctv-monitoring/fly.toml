# Static site: Store Monitoring final report + costing
# Deploy: fly launch --copy-config --name <your-app-name> --region bom --now
app = "store-monitoring-report"
primary_region = "bom"

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
