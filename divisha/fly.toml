# Divisha Wellness on fly.io. Deploy from this folder (divisha/): see DEPLOY.md.
app = "divisha-wellness"
primary_region = "sin"              # Singapore: the closest Fly region to India (Fly has no Indian region)

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  COOKIE_SECURE = "1"
  DAILY_CLAUDE_LIMIT = "150"
  DEFAULT_TZ = "Asia/Kolkata"        # used when a phone doesn't say its time zone

# The diary and its files. One machine, one volume.
[mounts]
  source = "divisha_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"        # stays awake so reminders go out on time, even with every phone locked
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
